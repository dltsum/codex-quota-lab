services:
  quotalab:
    build: .
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      QUOTALAB_SECURE_COOKIES: "true"
      QUOTALAB_TRUST_PROXY: "true"
    expose:
      - "4317"
    volumes:
      - quotalab-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - quotalab
    environment:
      QUOTALAB_DOMAIN: ${QUOTALAB_DOMAIN:?set QUOTALAB_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  quotalab-data:
  caddy-data:
  caddy-config:
